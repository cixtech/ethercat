PACKAGE_NAME="ethercat_git"
PACKAGE_VERSION="master"
AUTOINSTALL=yes

# Do not list NIC drivers that Kbuild does not build.
BUILT_MODULE_NAME[0]=ec_master
BUILT_MODULE_LOCATION[0]=master
BUILT_MODULE_NAME[1]=ec_macb
BUILT_MODULE_LOCATION[1]=devices/macb
BUILT_MODULE_NAME[2]=ec_generic
BUILT_MODULE_LOCATION[2]=devices
# /updates/dkms/ is the kernel/dkms location for out-of-tree modules; not
# auto-loaded, startup_ethercat.sh insmods them.
DEST_MODULE_LOCATION[0]=/updates/dkms/
DEST_MODULE_LOCATION[1]=/updates/dkms/
DEST_MODULE_LOCATION[2]=/updates/dkms/

# RTDM objects are gated in master/Kbuild on CONFIG_XENOMAI.
#
# The leading `find ... -delete` wipes stale .ko/.o/.mod* left by a
# previous kernel's build (dkms 3.2.2 shares build_dir across kernels;
# without the wipe, kbuild would link the new kernel's vermagic against
# stale .o files and emit .ko with the wrong kernel tag). The find path
# is dkms-substituted, not $PWD.
MAKE[0]="find ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build -type f \\( -name '*.ko' -o -name '*.o' -o -name '*.mod*' -o -name '*.cmd' \\) -delete 2>/dev/null; make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
